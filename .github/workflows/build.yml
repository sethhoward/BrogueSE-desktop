name: "Build"
on:
  push:
    branches:
    - '**'
    tags:
    - 'v*'             # pushing a v* tag builds and publishes a GitHub Release
  workflow_dispatch:   # allow manual runs from the Actions tab

jobs:

  # ---------------------------------------------------------------------------
  # Windows (primary target). Built on a Windows runner with MinGW, mirroring
  # the upstream BrogueCE desktop build.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
    - name: "Checkout sources"
      uses: actions/checkout@v4

    - name: "Install dependencies"
      run: |
        .\.github\get-deps-mingw.ps1

    - name: "Compile"
      shell: powershell
      run: |
        $env:path = $env:path + ";" + (Join-Path $pwd.Drive.Root "opt/local/x86_64-w64-mingw32/bin")
        mingw32-make SDL_CONFIG='sdl2-config --prefix=/opt/local/x86_64-w64-mingw32' SYSTEM=WINDOWS CC=gcc bin/brogue.exe

    - name: "Create artifact"
      run: |
        mingw32-make SYSTEM=WINDOWS BrogueSE-windows
        cp SDL2\x86_64-w64-mingw32\bin\SDL2.dll BrogueSE-windows
        cp SDL2_image\x86_64-w64-mingw32\bin\SDL2_image.dll BrogueSE-windows
        7z a BrogueSE-windows-x86_64.zip BrogueSE-windows

    - name: "Upload artifact"
      uses: actions/upload-artifact@v4
      with:
        name: windows-x86_64
        path: BrogueSE-windows-x86_64.zip
        compression-level: 0  # already compressed

  # ---------------------------------------------------------------------------
  # Linux (secondary target).
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-22.04
    steps:
    - name: "Install dependencies"
      run: |
        sudo apt update -y
        sudo apt install -y libsdl2-dev libsdl2-image-dev

    - name: "Checkout sources"
      uses: actions/checkout@v4

    - name: "Compile"
      run: |
        make bin/brogue

    - name: "Create artifact"
      run: |
        make BrogueSE-linux
        tar -czvf BrogueSE-linux-x86_64.tar.gz BrogueSE-linux

    - name: "Upload artifact"
      uses: actions/upload-artifact@v4
      with:
        name: linux-x86_64
        path: BrogueSE-linux-x86_64.tar.gz
        compression-level: 0  # already compressed

  # ---------------------------------------------------------------------------
  # Release. Runs only for v* tag pushes: gathers the Windows + Linux artifacts
  # and publishes them on a GitHub Release for the tag.
  # ---------------------------------------------------------------------------
  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the release
    steps:
    - name: "Checkout sources"
      uses: actions/checkout@v4

    - name: "Download build artifacts"
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: "Extract release notes from CHANGELOG"
      run: |
        ver="${GITHUB_REF_NAME#v}"
        # Pull the "## <ver> ..." section out of CHANGELOG.md, up to the next "## " header.
        awk -v ver="$ver" '
          $0 ~ ("^## " ver " ") { grab=1; print; next }
          grab && /^## / { exit }
          grab { print }
        ' CHANGELOG.md > RELEASE_NOTES.md
        if [ ! -s RELEASE_NOTES.md ]; then
          echo "See CHANGELOG.md for the full change list." > RELEASE_NOTES.md
        fi
        echo "----- release notes -----"; cat RELEASE_NOTES.md

    - name: "Publish GitHub Release"
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ github.ref_name }}" \
          --repo "${{ github.repository }}" \
          --title "Brogue SE ${{ github.ref_name }}" \
          --notes-file RELEASE_NOTES.md \
          artifacts/windows-x86_64/BrogueSE-windows-x86_64.zip \
          artifacts/linux-x86_64/BrogueSE-linux-x86_64.tar.gz
